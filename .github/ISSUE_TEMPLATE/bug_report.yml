name: Bug report
description: Something in bot-bom is broken or behaves wrongly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: In the app, open About → This build and paste what it shows.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked or entered, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help. Don't include private information.
